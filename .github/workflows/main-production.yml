name: main-production

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  production-gate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: make lint

      - name: Security checks (Bandit + pip-audit)
        run: make security

      - name: Test gates
        run: |
          make test-unit
          make test-integration
          make test-coverage

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform validate
        run: make terraform-validate

      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.ENABLE_TF_APPLY == 'true' && secrets.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Terraform apply (production)
        if: ${{ vars.ENABLE_TF_APPLY == 'true' && secrets.AWS_ROLE_TO_ASSUME != '' }}
        run: |
          terraform -chdir=terraform init
          terraform -chdir=terraform apply -auto-approve \
            -var-file=terraform.production.tfvars

      - name: Skip deploy notice
        if: ${{ !(vars.ENABLE_TF_APPLY == 'true' && secrets.AWS_ROLE_TO_ASSUME != '') }}
        run: |
          echo "Deployment skipped."
          echo "Set repository variable ENABLE_TF_APPLY=true and secret AWS_ROLE_TO_ASSUME to enable production apply."
